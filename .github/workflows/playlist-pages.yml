name: Deploy public playlists to Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/playlist-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-playlist-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the static site boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d site && test ! -L site
          test "$(find site -mindepth 1 -maxdepth 1 | wc -l)" -eq 14
          for name in index.html status.json .nojekyll \
            tamil_youtube_live.m3u australian_youtube_live.m3u \
            uk_youtube_live.m3u us_youtube_live.m3u \
            tamil_australian_youtube_live.m3u english_youtube_live.m3u \
            all_youtube_live.m3u all_live.m3u tamil_live.m3u \
            tamil_broadcaster_live.m3u tamil_iptv_live.m3u; do
            test -f "site/${name}" && test ! -L "site/${name}"
          done
          test -s site/index.html && test -s site/status.json
          test ! -s site/.nojekyll
          for playlist in site/*.m3u; do
            test "$(head -n 1 "$playlist")" = '#EXTM3U'
          done
          # No media URLs or file contents are written to logs.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy public playlists
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4